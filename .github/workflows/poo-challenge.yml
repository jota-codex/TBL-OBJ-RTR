name: POO Challenge
on:
  push:
    paths: ['POO-Challenge/**', '.github/workflows/poo-challenge.yml']
  pull_request:
    paths: ['POO-Challenge/**', '.github/workflows/poo-challenge.yml']
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build POO-Challenge --configuration Release
      - run: dotnet run --project POO-Challenge --configuration Release --no-build -- --test
      - run: dotnet run --project POO-Challenge --configuration Release --no-build -- --demo
